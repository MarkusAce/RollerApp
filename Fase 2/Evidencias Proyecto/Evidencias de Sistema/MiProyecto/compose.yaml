services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rollerapp
      MYSQL_USER: rollerapp
      MYSQL_PASSWORD: ${DB_CONTRASENA:?Definir DB_CONTRASENA}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/ejemplo_datos.sql:/docker-entrypoint-initdb.d/02-ejemplos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend-spring
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/rollerapp?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      DB_USUARIO: rollerapp
      DB_CONTRASENA: ${DB_CONTRASENA:?Definir DB_CONTRASENA}
      JWT_SECRETO: ${JWT_SECRETO:?Definir JWT_SECRETO}
      FRONTEND_ORIGENES: ${FRONTEND_ORIGENES:?Falta FRONTEND_ORIGENES}
      BACKEND_URL_PUBLICA: ${BACKEND_URL_PUBLICA:?Falta BACKEND_URL_PUBLICA}
      FRONTEND_URL_PAGO_RETORNO: ${FRONTEND_URL_PAGO_RETORNO:?Falta FRONTEND_URL_PAGO_RETORNO}
      IMAGENES_DIRECTORIO: /app/uploads/productos
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-apikey}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-responder@rollerapp.cl}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-rollerapp.spa@gmail.com}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      WEBPAY_AMBIENTE: ${WEBPAY_AMBIENTE:-integracion}
      WEBPAY_CODIGO_COMERCIO: ${WEBPAY_CODIGO_COMERCIO:-597055555532}
      WEBPAY_API_KEY: ${WEBPAY_API_KEY:-579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
      COMISION_PORCENTAJE_VENDEDOR: ${COMISION_PORCENTAJE_VENDEDOR:-5}
    volumes:
      - imagenes_data:/app/uploads/productos

  web:
    build: ./frontend-web
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8088:80"]

volumes:
  mysql_data:
  imagenes_data:
